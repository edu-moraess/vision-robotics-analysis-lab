perception:
  mode: CURRENT
  model_path: yolo11n.pt
  confidence_threshold: 0.35
  iou_threshold: 0.45
  device: auto
  image_size: 640
  classes: null
  max_detections: 100
  tracker_type: IOU
  tracking_enabled: false
  smoothing_enabled: false
  smoothing_method: RAW
  smoothing_window: 5
  smoothing_alpha: 0.35
  calibration_status: NOT CALIBRATED
  class_mapping:
    person: HIGH
    bicycle: HIGH
    car: HIGH
    motorcycle: HIGH
    bus: HIGH
    truck: HIGH
    chair: MEDIUM
    couch: MEDIUM
    bed: MEDIUM
    dining table: MEDIUM
    table: MEDIUM
    bench: MEDIUM
    obstacle: HIGH
    wall: CRITICAL
    barrier: CRITICAL
    dynamic: HIGH

input:
  frame_buffer_capacity: 3
  drop_policy: LATEST_FRAME
  metadata_fields:
    - frame_id
    - timestamp
    - source
    - resolution
    - fps
    - metadata

arqtech:
  model_version: v0.2-modular
  status: NOT TRAINED
  checkpoint: ""
  framework: PyTorch
  task: patch_classification_bootstrap
  detection_status: NOT AVAILABLE WITHOUT REVIEWED DETECTION CHECKPOINT
  dataset_scope: HUMAN_REVIEW_REQUIRED

groq:
  enabled: false
  model: qwen/qwen3.6-27b
  timeout_s: 20
  retries: 1
  max_completion_tokens: 512
  secret: GROQ_API_KEY
  role: EXTERNAL MULTIMODAL ANALYSIS LAYER
  ground_truth: false

detector:
  min_area: 80
  conf_threshold: 0.35
  nms_iou: 0.40
  canny_low: 50
  canny_high: 150

scene:
  lower_roi_ratio: 0.45
  edge_threshold: 0.12

risk:
  low: 0.30
  medium: 0.55
  high: 0.75

planning:
  cell_size: 16
  inflation: 1

streamlit:
  max_image_side: 1280
